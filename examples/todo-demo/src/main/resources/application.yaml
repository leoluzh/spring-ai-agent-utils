spring:
  application:
  name: todo-demo
  main:
    web-application-type: none

  ai:
    ## Anthropic Claude SDK
    anthropic:
      api-key: ${ANTHROPIC_API_KEY}
      chat:
        options:
          model: claude-sonnet-4-5-20250929
          max-tokens: 1000
    ## OpenAI SDK
    openai-sdk:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: gpt-5-mini-2025-08-07
          temperature: 1.0
    ## Google GenAI SDK
    google:
      genai:
        project-id: ${GOOGLE_CLOUD_PROJECT}
        #location: ${GOOGLE_CLOUD_LOCATION}
        location: global
        chat:
          options:
            model: gemini-3.1-pro-preview
    ## Ollama
    ollama:
      base-url: http://localhost:11434
      init:
        pull-model-strategy: always
        timeout: 60s
        max-retries: 1
      chat:
        options:
          model: qwen2.5:14b
          think: false
          additional-models:
            - gemma4:31b
            - qwen3.5
            - llama4
            - nemotron-cascade-2
    ## MCP Client Configuration
    mcp:
      client:
        stdio:
          servers-configuration: classpath:/mcp-servers-config.json


## AGENT CONFIGURATION

## Skills
agent:
  skills:
    paths: 'classpath:/.claude/skills'
## Model info (Must match the configured model above)
#    model:
#      name: claude-sonnet-4-5-20250929
#      knowledge:
#        cutoff: 2025-01-01

#  model:
#    name: gpt-5-mini-2025-08-07
#    knowledge:
#      cutoff: 2025-08-07

  model:
    name: qwen2.5:14b
    knowledge:
      cutoff: Unknown

logging:
  level:
    org.springframework.ai.ollama: DEBUG
    org.springframework.web.client: DEBUG